<!DOCTYPE html>
<html>
<head>
<title>MiniTube</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f0f0f;
    color: white;
}

header {
    background: #202020;
    padding: 12px;
    font-size: 22px;
    font-weight: bold;
}

#secreto {
    float: right;
    cursor: pointer;
    font-size: 22px;
    opacity: 0.3;
}
#secreto:hover { opacity: 1; }

.container {
    display: flex;
    padding: 15px;
}

.player {
    flex: 3;
    text-align: center;
}

video, iframe {
    width: 90%;
    max-width: 720px;
    height: 400px;
    border-radius: 12px;
}

.lista {
    flex: 1;
    padding: 10px;
}

.item {
    background: #181818;
    padding: 10px;
    margin-bottom: 10px;
    cursor: pointer;
    border-radius: 8px;
}

.item:hover {
    background: #333;
}
</style>
</head>

<body>

<header>
    ▶️ MiniTube
    <span id="secreto">🤫</span>
</header>
